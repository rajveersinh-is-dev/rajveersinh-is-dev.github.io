<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#07080a" />
  <circle cx="32" cy="32" r="26" stroke="#222834" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <!-- Simplicial / Topological Hypergraph Geometry -->
  <polygon points="32,10 53,46 11,46" stroke="#333e50" stroke-width="1.5" fill="#11151e" fill-opacity="0.6"/>
  <polygon points="32,54 11,18 53,18" stroke="#f59e0b" stroke-width="1.5" fill="#f59e0b" fill-opacity="0.08"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ff7700" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="11" y1="46" x2="53" y2="18" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="53" y1="46" x2="11" y2="18" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Mathematical nodes -->
  <circle cx="32" cy="32" r="4.5" fill="#ff7700"/>
  <circle cx="32" cy="10" r="3" fill="#f59e0b"/>
  <circle cx="53" cy="46" r="3" fill="#f59e0b"/>
  <circle cx="11" cy="46" r="3" fill="#f59e0b"/>
  <circle cx="11" cy="18" r="2.5" fill="#94a3b8"/>
  <circle cx="53" cy="18" r="2.5" fill="#94a3b8"/>
  <circle cx="32" cy="54" r="2.5" fill="#94a3b8"/>
</svg>
