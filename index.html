    <!-- Theme Preference Restoration (Zero Remote Dependencies) -->
    <script>
      (function () {
        try {
          const readingMode = localStorage.getItem('rvp_reading_mode');
          const theme = localStorage.getItem('rvp_theme');
          if (readingMode === 'true' || theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('reading-mode');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('reading-mode');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Offline Service Worker Registration & Dev Hygiene -->
    <script>
      (function () {
        if ('serviceWorker' in navigator) {
          const port = window.location.port;
          const host = window.location.hostname;
          const isDevHost = Boolean(
            (port && port !== '80' && port !== '443') ||
            host === 'localhost' ||
            host === '127.0.0.1' ||
            host === '[::1]' ||
            host.endsWith('.local') ||
            host.startsWith('192.168.') ||
            host.startsWith('10.') ||
            host.startsWith('172.')
          );
          if (isDevHost) {
            // Unregister any stale service workers and clear caches in development to prevent 404 blank screens
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (const r of registrations) {
                r.unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function (names) {
                for (const name of names) {
                  caches.delete(name);
                }
              });
            }
          } else if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
          }
        }

        // Diagnostic fallback if user opened index.html directly from desktop file explorer (file:// protocol)
        if (window.location.protocol === 'file:') {
          window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
              const root = document.getElementById('root');
              if (root && root.children.length === 0) {
                root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#121110;color:#ede8df;font-family:serif;"><div style="max-width:560px;border:1px solid #5c5449;background:#1a1816;padding:32px;text-align:center;"><h2 style="font-size:22px;font-weight:bold;margin-bottom:12px;color:#be123c;">Acta Mathematica &amp; Computatoria</h2><p style="font-size:14px;color:#bab2a4;line-height:1.6;margin-bottom:16px;">This research archive requires a local HTTP web server to load modern ES modules.<br/>Please launch the server using:<br/><code style="display:inline-block;background:#121110;border:1px solid #38332d;color:#d97706;padding:8px 16px;margin-top:12px;font-family:monospace;font-size:13px;border-radius:3px;">npm run dev -- --host</code></p><p style="font-size:13px;color:#7a7266;">Then visit <a href="http://localhost:5173" style="color:#60a5fa;text-decoration:underline;">http://localhost:5173</a> in your browser.</p></div></div>';
              }
            }, 600);
          });
        }
      })();
    </script>
